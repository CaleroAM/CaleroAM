  <text x="38" y="182" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">os:</text>
  <text x="150" y="182" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">Linux 6.x · Declarative &amp; Reproducible Systems</text>

  <text x="38" y="206" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">architecture:</text>
  <text x="150" y="206" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">Clean Architecture · DDD · Idempotent Backends</text>

  <text x="38" y="230" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">ai_engineering:</text>
  <text x="150" y="230" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">Deterministic Wrappers, Tree-sitter &amp; MLOps</text>

  <path d="M38 248H624" stroke="#252839" stroke-width="1"/>

  <!-- Prompt 3: projects -->
  <text x="38" y="276" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15" font-weight="700">❯ ls -1 ./featured-projects/</text>
  
  <text x="38" y="302" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">graphtyn/</text>
  <text x="150" y="302" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">Code Intelligence &amp; MCP Server (v0.10.x)</text>

  <text x="38" y="326" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">isac26/</text>
  <text x="150" y="326" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">StatsBomb &amp; Club América Analytics Engine</text>

  <text x="38" y="350" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">modIAceb/</text>
