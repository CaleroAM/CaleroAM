  <text x="38" y="112" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" font-weight="700">ángel_calero</text>
  <text x="150" y="112" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">—</text>
  <text x="170" y="112" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">Systems &amp; Backend Engineer</text>

  <path d="M38 128H624" stroke="#252839" stroke-width="1"/>

  <!-- Prompt 2: system info -->
