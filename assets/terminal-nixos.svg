  <!-- Pestaña activa de Linux -->
  <path d="M14 40 L14 14 C14 10 18 8 22 8 L180 8 C184 8 188 10 188 40 Z" fill="#181926"/>
  <text x="32" y="26" fill="#c0caf5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="600">calero@linux: ~</text>
  <text x="168" y="25" fill="#565f89" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12">×</text>

