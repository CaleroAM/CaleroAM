<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" width="960" height="410" role="img" aria-labelledby="title desc">
  <title id="title">Ángel Calero — Systems &amp; Backend Engineer</title>
  <desc id="desc">Linux terminal window with 1-bit dithered dot transition between Tux Penguin and Pixel Crab.</desc>

  <!-- Ventana principal estilo Linux -->
  <rect width="960" height="410" rx="8" fill="#12131c"/>
  <rect x="1.5" y="1.5" width="957" height="407" rx="7" fill="none" stroke="#252839" stroke-width="1.8"/>

